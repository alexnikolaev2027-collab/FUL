name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable

      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager -type f | head -n 1)
          yes | $SDKMANAGER --licenses || true

      - name: Ensure NDK and CMake
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager -type f | head -n 1)
          yes | $SDKMANAGER "ndk;27.0.12077973" "cmake;3.22.1" || true

      - name: Flutter doctor
        run: flutter doctor

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install flet

      - name: Build APK
        run: flet build apk --verbose

      - uses: actions/upload-artifact@v4
        with:
          name: fuel-app-apk
          path: build/apk
